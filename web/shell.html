<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night Port Drift</title>
<style>
  /* 画面いっぱいにゲームを出す。スクロールや選択は起こさない */
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #04050b;
    color: #e8ecf5;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    outline: none;
    background: #04050b;
  }
  /* 読み込み中の表示 */
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: radial-gradient(ellipse at center, #10142a 0%, #04050b 70%);
    transition: opacity 0.6s;
    z-index: 2;
  }
  #loading.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #loading h1 {
    margin: 0;
    font-size: clamp(28px, 6vw, 64px);
    letter-spacing: 0.12em;
    color: #ff4fb3;
    text-shadow: 0 0 18px #ff2fa0, 0 0 42px #7a1cff;
  }
  #bar {
    width: min(320px, 70vw);
    height: 4px;
    background: #1b2040;
    border-radius: 2px;
    overflow: hidden;
  }
  #bar div {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #2ee6ff, #ff4fb3);
    transition: width 0.2s;
  }
  #status {
    font-size: 14px;
    opacity: 0.7;
  }
  /* 右上の全画面ボタン */
  #fullscreen {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    z-index: 3;
    padding: 6px 12px;
    border: 1px solid #ffffff40;
    border-radius: 6px;
    background: #00000060;
    color: #e8ecf5;
    font-size: 13px;
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.2s;
  }
  #fullscreen:hover {
    opacity: 1;
  }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="loading">
  <h1>NIGHT PORT DRIFT</h1>
  <div id="bar"><div></div></div>
  <div id="status">読み込み中…</div>
</div>
<button id="fullscreen" type="button" title="全画面（F キー）">全画面 F</button>
<script>
  const canvas = document.getElementById('canvas');
  const loading = document.getElementById('loading');
  const barFill = document.querySelector('#bar div');
  const statusText = document.getElementById('status');

  // キー入力がアドレスバーなどではなくゲームに届くよう、キャンバスにフォーカスを置く
  function focusGame() {
    window.focus();
    canvas.focus({ preventScroll: true });
  }

  // ブラウザは、ユーザーが何か操作するまで音を止めている。最初の操作で再開する
  function resumeAudio() {
    if (typeof SDL2 !== 'undefined' && SDL2.audioContext && SDL2.audioContext.state === 'suspended') {
      SDL2.audioContext.resume();
    }
  }

  function toggleFullscreen() {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else {
      document.documentElement.requestFullscreen().catch(() => {});
    }
    focusGame();
  }

  for (const type of ['pointerdown', 'keydown', 'touchstart']) {
    window.addEventListener(type, () => { focusGame(); resumeAudio(); }, { capture: true });
  }
  window.addEventListener('keydown', (event) => {
    if (event.code === 'KeyF' && !event.repeat) {
      toggleFullscreen();
    }
    // Space や矢印キーでページがスクロールしないようにする
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.code)) {
      event.preventDefault();
    }
  }, { capture: true });
  document.getElementById('fullscreen').addEventListener('click', (event) => {
    event.stopPropagation();
    toggleFullscreen();
  });
  window.addEventListener('load', focusGame);

  var Module = {
    canvas: canvas,
    print: (text) => console.log(text),
    printErr: (text) => console.warn(text),
    setStatus: (text) => {
      const match = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      if (match) {
        barFill.style.width = (100 * parseFloat(match[2]) / parseFloat(match[4])) + '%';
        statusText.textContent = '読み込み中…';
      } else if (text) {
        statusText.textContent = text;
      }
    },
    onRuntimeInitialized: () => {
      barFill.style.width = '100%';
      loading.classList.add('hidden');
      focusGame();
    },
  };
  window.addEventListener('error', () => {
    statusText.textContent = 'エラーが起きました。再読み込みしてください。';
  });
</script>
{{{ SCRIPT }}}
</body>
</html>
